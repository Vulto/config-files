<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- Unifont Sample advertises the entire PUA but draws tofu.
	     dwm/st pick it as the Iosevka fallback and icons vanish. -->
	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="family"><string>Unifont Sample</string></patelt>
			</pattern>
		</rejectfont>
	</selectfont>
	<selectfont>
		<rejectfont>
			<glob>*/unifont_sample*.otf</glob>
		</rejectfont>
	</selectfont>
	<selectfont>
		<rejectfont>
			<glob>*/unifont_sample*.ttf</glob>
		</rejectfont>
	</selectfont>

	<!-- Patched Terminus (Terminess) already contains the icons.
	     Iosevka stays as a fallback chain if you switch back. -->
	<alias>
		<family>Terminess Nerd Font Mono</family>
		<prefer>
			<family>Terminess Nerd Font Mono</family>
			<family>Symbols Nerd Font Mono</family>
		</prefer>
	</alias>
	<alias>
		<family>Iosevka</family>
		<prefer>
			<family>Iosevka</family>
			<family>Symbols Nerd Font Mono</family>
		</prefer>
	</alias>
	<alias>
		<family>iosevka</family>
		<prefer>
			<family>Iosevka</family>
			<family>Symbols Nerd Font Mono</family>
		</prefer>
	</alias>

	<match target="pattern">
		<edit name="family" mode="append" binding="weak">
			<string>Symbols Nerd Font Mono</string>
		</edit>
	</match>
</fontconfig>
